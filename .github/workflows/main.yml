name: Run application

on: 
  workflow_dispatch:

jobs:
  run-application:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run application
        run: |
          python -m src.main

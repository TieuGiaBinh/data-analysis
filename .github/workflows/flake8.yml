name: Run Flake8

on:
  push:

jobs:
  flake8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: python -m pip install flake8==7.3.0

      - name: Run Flake8
        run: python -m flake8 .
